plugins {
    id 'application'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    implementation project(':common')
    implementation "org.apache.sshd:sshd-core:${rootProject.ext.sshdVersion}"
    implementation "org.apache.sshd:sshd-sftp:${rootProject.ext.sshdVersion}"
    implementation 'com.fazecast:jSerialComm:2.11.0'
    implementation 'net.java.dev.jna:jna:5.14.0'   // közvetlen Bluetooth (Winsock RFCOMM) COM port nélkül
    implementation 'com.formdev:flatlaf:3.5.1'
    runtimeOnly 'org.slf4j:slf4j-nop:1.7.36'
}

application {
    mainClass = 'com.devicebridge.desktop.DesktopMain'
    applicationName = 'DeviceBridge'
}

// Egyetlen futtatható JAR minden függőséggel: desktop/build/libs/DeviceBridge-desktop.jar
tasks.register('fatJar', Jar) {
    group = 'build'
    description = 'Önálló, futtatható JAR készítése.'
    archiveFileName = 'DeviceBridge-desktop.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.findAll { it.name.endsWith('.jar') }.collect { zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/versions/*/module-info.class', 'module-info.class'
}

tasks.named('assemble') { dependsOn 'fatJar' }

// Hordozható Windows alkalmazás saját Java futtatókörnyezettel (Java telepítése nem kell):
// desktop/build/jpackage/DeviceBridge/DeviceBridge.exe  és  desktop/build/distributions/DeviceBridge-portable.zip
def jpackageInput = layout.buildDirectory.dir('jpackage-input')
def jpackageDest = layout.buildDirectory.dir('jpackage')

tasks.register('prepareJpackageInput', Sync) {
    from tasks.named('fatJar')
    into jpackageInput
}

tasks.register('portableApp', Exec) {
    group = 'distribution'
    description = 'Hordozható DeviceBridge.exe (jpackage app-image).'
    dependsOn 'prepareJpackageInput'
    inputs.dir(jpackageInput)
    inputs.file('packaging/DeviceBridge.ico')
    outputs.dir(jpackageDest)
    doFirst { delete jpackageDest }
    def jpackage = "${System.getProperty('java.home')}/bin/jpackage"
    commandLine jpackage,
            '--type', 'app-image',
            '--name', 'DeviceBridge',
            '--app-version', '1.0.0',
            '--vendor', 'DeviceBridge',
            '--description', 'DeviceBridge - PC es Android osszekapcsolasa',
            '--input', jpackageInput.get().asFile.absolutePath,
            '--main-jar', 'DeviceBridge-desktop.jar',
            '--main-class', application.mainClass.get(),
            '--icon', file('packaging/DeviceBridge.ico').absolutePath,
            '--add-modules', 'java.base,java.desktop,java.logging,java.management,java.naming,java.rmi,' +
                    'java.security.jgss,jdk.crypto.ec,jdk.charsets,jdk.unsupported,jdk.zipfs',
            '--jlink-options', '--strip-debug --no-man-pages --no-header-files',
            '--java-options', '-Dfile.encoding=UTF-8',
            '--dest', jpackageDest.get().asFile.absolutePath
}

tasks.register('portableZip', Zip) {
    group = 'distribution'
    description = 'A hordozható alkalmazás ZIP-be csomagolva.'
    dependsOn 'portableApp'
    from(jpackageDest)
    archiveFileName = 'DeviceBridge-portable.zip'
    destinationDirectory = layout.buildDirectory.dir('distributions')
}
