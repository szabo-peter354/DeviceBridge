plugins {
    id 'com.android.application'
}

android {
    namespace 'com.devicebridge.android'
    compileSdk 35

    defaultConfig {
        applicationId 'com.devicebridge.android'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }

    // Kiadási aláírás: android-app/keystore.properties (nincs a gitben – őrizd meg, frissítéshez ugyanez a kulcs kell!)
    def ksFile = file('keystore.properties')
    def ks = new Properties()
    if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file(ks.getProperty('storeFile'))
                storePassword ks.getProperty('storePassword')
                keyAlias ks.getProperty('keyAlias')
                keyPassword ks.getProperty('keyPassword')
            }
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE*',
                'META-INF/NOTICE*',
                'META-INF/INDEX.LIST',
                'META-INF/versions/9/module-info.class'
            ]
        }
    }
}

dependencies {
    implementation project(':common')
    implementation "org.apache.sshd:sshd-core:${rootProject.ext.sshdVersion}"
    implementation "org.apache.sshd:sshd-sftp:${rootProject.ext.sshdVersion}"
    implementation 'org.slf4j:slf4j-nop:1.7.36'
}
