plugins {
    id 'com.android.application'
}

android {
    namespace 'com.devicebridge.android'
    compileSdk 35

    defaultConfig {
        applicationId 'com.devicebridge.android'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE*',
                'META-INF/NOTICE*',
                'META-INF/INDEX.LIST',
                'META-INF/versions/9/module-info.class'
            ]
        }
    }
}

dependencies {
    implementation project(':common')
    implementation "org.apache.sshd:sshd-core:${rootProject.ext.sshdVersion}"
    implementation "org.apache.sshd:sshd-sftp:${rootProject.ext.sshdVersion}"
    implementation 'org.slf4j:slf4j-nop:1.7.36'
}
